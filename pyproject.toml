[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "host-drift-auditor"
version = "0.1.0"
description = "Modular Linux host security telemetry and configuration drift auditor"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
host-auditor = "host_auditor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]