[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hostdrift"
version = "0.1.1"
description = "Zero-dependency Linux host drift detection: SUID/SGID, listening ports, and critical file integrity against a baseline."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
keywords = ["security", "linux", "drift-detection", "file-integrity", "audit", "blue-team", "hardening"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Intended Audience :: System Administrators",
  "Topic :: Security",
  "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://github.com/Akira-8/HostDrift"
Issues = "https://github.com/Akira-8/HostDrift/issues"

[project.scripts]
hostdrift = "hostdrift.cli:main"
host-auditor = "hostdrift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]